<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D88A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8B6A2A"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0C0C0F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="url(#bg)"/>

  <!-- Gold border -->
  <rect width="32" height="32" rx="5" fill="none" stroke="#C9A96E" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- 3D depth layers (darkest → lighter → main) -->
  <text x="17.2" y="24.2" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="21"
        fill="#2A1800" opacity="0.9">C!</text>

  <text x="16.8" y="23.8" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="21"
        fill="#5A3410" opacity="0.85">C!</text>

  <text x="16.4" y="23.4" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="21"
        fill="#8B5A20" opacity="0.8">C!</text>

  <!-- Main text with gradient + glow -->
  <text x="16" y="23" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="21"
        fill="url(#gold)" filter="url(#glow)">C!</text>
</svg>
