server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: gateway
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:80"
              - "http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: http://auth-service:8090
          predicates:
            - Path=/auth/**

        - id: movies-service
          uri: http://movies-service:9000
          predicates:
            - Path=/movies/**,/tv/**,/actors/**

        - id: social-service
          uri: http://social-service:9010
          predicates:
            - Path=/ratings/**,/comments/**,/favorites/**,/lists/**

        - id: notifications-service
          uri: http://notifications-service:9020
          predicates:
            - Path=/notifications/**

jwt:
  secret: ${JWT_SECRET}