server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: gateway
    gateway:
      # CORS global — autorise le frontend Vite (dev) et le conteneur nginx (prod)
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
              - "http://localhost:80"
              - "http://localhost"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: http://auth-service:8090
          predicates:
            - Path=/auth/**

        - id: admin
          uri: http://auth-service:8090
          predicates:
            - Path=/admin/**

        - id: movies-service
          uri: http://movies-service:9000
          predicates:
            - Path=/movies/**,/tv/**,/actors/**

        - id: social-service
          uri: http://social-service:9010
          predicates:
            - Path=/ratings/**,/comments/**,/favorites/**,/lists/**

        - id: notifications-service
          uri: http://notifications-service:9020
          predicates:
            - Path=/notifications/**

jwt:
  secret: ${JWT_SECRET}
