services:
  mysql:
    image: mysql:8.0
    container_name: clap_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "3306:3306"
    healthcheck:
      # Vérifie que MySQL accepte des connexions ET que les bases sont créées
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s   # laisse init-db.sh finir avant de commencer à compter

  consul:
    image: hashicorp/consul
    container_name: clap-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build: ./Services/auth
    container_name: auth-service
    restart: on-failure   # redémarre automatiquement si MySQL n'était pas encore prêt
    ports:
      - "8090:8090"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy

  movies-service:
    build: ./Services/movies
    container_name: movies-service
    restart: on-failure
    ports:
      - "9000:9000"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy

  social-service:
    build: ./Services/social
    container_name: social-service
    restart: on-failure
    ports:
      - "9010:9010"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy

  notifications-service:
    build: ./Services/notifications
    container_name: notifications-service
    restart: on-failure
    ports:
      - "9020:9020"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      consul:
        condition: service_healthy
      auth-service:
        condition: service_started
      movies-service:
        condition: service_started
      social-service:
        condition: service_started
      notifications-service:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: clap-frontend
    restart: on-failure
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  mysql_data:
