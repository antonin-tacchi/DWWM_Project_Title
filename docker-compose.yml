services:

  mongodb:
    image: mongo:7
    container_name: clap-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: clap_cache
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  consul:
    image: hashicorp/consul
    container_name: clap-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-service:
    build: ./Services/db-service
    container_name: db-service
    restart: unless-stopped
    ports:
      - "8060:8060"
    volumes:
      - db_data:/data
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:TieredStopAtLevel=1
        -XX:+UseContainerSupport
        -Xmx256m
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8060/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  auth-service:
    build: ./Services/auth
    container_name: auth-service
    restart: on-failure
    ports:
      - "8090:8090"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_EXPECTED_ACTION: ${TURNSTILE_EXPECTED_ACTION:-register}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      JAVA_TOOL_OPTIONS: >-
        -XX:TieredStopAtLevel=1
        -XX:+UseContainerSupport
        -Xmx256m
    depends_on:
      db-service:
        condition: service_healthy
      consul:
        condition: service_healthy

  movies-service:
    build: ./Services/movies
    container_name: movies-service
    restart: on-failure
    ports:
      - "9000:9000"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      JAVA_TOOL_OPTIONS: >-
        -XX:TieredStopAtLevel=1
        -XX:+UseContainerSupport
        -Xmx256m
    depends_on:
      db-service:
        condition: service_healthy
      consul:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  social-service:
    build: ./Services/social
    container_name: social-service
    restart: on-failure
    ports:
      - "9010:9010"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:TieredStopAtLevel=1
        -XX:+UseContainerSupport
        -Xmx256m
    depends_on:
      db-service:
        condition: service_healthy
      consul:
        condition: service_healthy

  notifications-service:
    build: ./Services/notifications
    container_name: notifications-service
    restart: on-failure
    ports:
      - "9020:9020"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:TieredStopAtLevel=1
        -XX:+UseContainerSupport
        -Xmx128m
    depends_on:
      db-service:
        condition: service_healthy
      consul:
        condition: service_healthy

  gateway:
    build: ./gateway
    container_name: gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: >-
        -XX:TieredStopAtLevel=1
        -XX:+UseContainerSupport
        -Xmx128m
    depends_on:
      consul:
        condition: service_healthy
      auth-service:
        condition: service_started
      movies-service:
        condition: service_started
      social-service:
        condition: service_started
      notifications-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: clap-frontend
    restart: on-failure
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  db_data:
  mongo_data:
