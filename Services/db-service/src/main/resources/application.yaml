server:
  port: 8060

spring:
  application:
    name: db-service

  datasource:
    url: jdbc:h2:file:/data/clap;MODE=MySQL;NON_KEYWORDS=VALUE,KEY;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Désactive la console H2 en production (sécurité)
  h2:
    console:
      enabled: false

  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: db-service
        health-check-path: /actuator/health
        health-check-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
